{% extends "base.html" %}

{% block title %}Подтверждение удаления рассылки{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="card border-danger">
        <div class="card-header bg-danger text-white">
            <h3 class="mb-0"><i class="fas fa-exclamation-triangle"></i> Подтверждение удаления</h3>
        </div>
        <div class="card-body">
            <p class="lead">Вы уверены, что хотите удалить рассылку "{{ object.message.subject }}"?</p>
            <p class="text-muted">Будет удалена вся связанная статистика.</p>

            <form method="post">
                {% csrf_token %}
                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <a href="{% url 'mailing:mailing_detail' object.pk %}" class="btn btn-secondary me-md-2">
                        <i class="fas fa-arrow-left"></i> Отмена
                    </a>
                    <button type="submit" class="btn btn-danger">
                        <i class="fas fa-trash-alt"></i> Удалить навсегда
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
