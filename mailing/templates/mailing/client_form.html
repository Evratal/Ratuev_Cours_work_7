{% extends "mailing/base.html" %}

{% block content %}
<div class="container">
    <h2>{% if object %}Редактировать клиента{% else %}Добавить нового клиента{% endif %}</h2>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            {{ form.as_p }}
        </div>
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{% url 'mailing:client_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
