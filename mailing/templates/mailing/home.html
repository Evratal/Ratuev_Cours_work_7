{% extends 'base.html' %}

{% block title %}Главная страница{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-4 mb-4">
            <div class="card text-white bg-primary h-100">
                <div class="card-body text-center">
                    <h2 class="card-title">{{ total_mailings }}</h2>
                    <p class="card-text">Всего рассылок</p>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-4">
            <div class="card text-white bg-success h-100">
                <div class="card-body text-center">
                    <h2 class="card-title">{{ active_mailings }}</h2>
                    <p class="card-text">Активных рассылок</p>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-4">
            <div class="card text-white bg-info h-100">
                <div class="card-body text-center">
                    <h2 class="card-title">{{ unique_clients }}</h2>
                    <p class="card-text">Уникальных клиентов</p>
                </div>
            </div>
        </div>
    </div>

    <div class="row mt-4">
        <div class="col-md-4 mb-3">
            <div class="card h-100">
                <div class="card-body text-center">
                    <h5><i class="fas fa-users"></i> Клиенты</h5>
                    <a href="{% url 'mailing:client_list' %}" class="btn btn-outline-primary mt-2">Управление</a>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-3">
            <div class="card h-100">
                <div class="card-body text-center">
                    <h5><i class="fas fa-envelope"></i> Сообщения</h5>
                    <a href="{% url 'mailing:message_list' %}" class="btn btn-outline-primary mt-2">Управление</a>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-3">
            <div class="card h-100">
                <div class="card-body text-center">
                    <h5><i class="fas fa-user"></i> Профиль</h5>
                    <a href="{% url 'mailing:profile' %}" class="btn btn-outline-primary mt-2">Перейти</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
