{% extends 'mailing/base.html' %}

{% block content %}
<div class="container">
  <h2>Мои сообщения</h2>
  <a href="{% url 'mailing:message_create' %}" class="btn btn-primary mb-3">
    <i class="fas fa-plus"></i> Создать сообщение
  </a>

  <div class="list-group">
    {% for message in messages %}
    <div class="list-group-item">
      <div class="d-flex justify-content-between align-items-center">
        <h5>{{ message.subject }}</h5>
        <div>
          <a href="{% url 'mailing:message_edit' message.pk %}" class="btn btn-sm btn-outline-secondary">
            <i class="fas fa-edit"></i>
          </a>
          <a href="{% url 'mailing:message_delete' message.pk %}" class="btn btn-sm btn-outline-danger">
            <i class="fas fa-trash"></i>
          </a>
        </div>
      </div>
      <p class="text-muted mb-1">Создано: {{ message.created_at|date:"d.m.Y H:i" }}</p>
      <p>{{ message.body|truncatechars:100 }}</p>
    </div>
    {% empty %}
    <div class="alert alert-info">Нет созданных сообщений</div>
    {% endfor %}
  </div>
</div>
{% endblock %}
