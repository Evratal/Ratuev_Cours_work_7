{% extends 'mailing/base.html' %}

{% block content %}
<div class="container">
  <div class="card border-danger">
    <div class="card-header bg-danger text-white">
      <h3>Удаление сообщения</h3>
    </div>
    <div class="card-body">
      <p>Вы уверены, что хотите удалить сообщение "{{ object.subject }}"?</p>
      <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'mailing:message_list' %}" class="btn btn-secondary">Отмена</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
