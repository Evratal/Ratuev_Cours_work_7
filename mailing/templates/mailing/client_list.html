{% extends "mailing/base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Список клиентов</h2>
    <a href="{% url 'mailing:client_create' %}" class="btn btn-primary mb-3">Добавить клиента</a>
    
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Email</th>
                <th>ФИО</th>
                <th>Комментарий</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody>
            {% for client in object_list %}
            <tr>
                <td>{{ client.email }}</td>
                <td>{{ client.full_name }}</td>
                <td>{{ client.comment }}</td>
                <td>
                    <a href="{% url 'mailing:client_edit' client.pk %}" class="btn btn-sm btn-warning">Редактировать</a>
                    <a href="{% url 'mailing:client_delete' client.pk %}" class="btn btn-sm btn-danger">Удалить</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4">Нет клиентов</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
